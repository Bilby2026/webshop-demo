<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORIGIN-L Shop - Vollständige Demo</title>
  <style>
    /* [Vorherige CSS bleibt identisch - gekürzt für Übersichtlichkeit] */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);

/*  Original Background    #1e3c72 0%, #2a5298 100%    */
      min-height: 100vh; padding: 20px; 
    }
    /* ... [Alle vorherigen Styles bleiben gleich] ... */
    
    /* Neue Styles für Backend-Integration */
    .loading { opacity: 0.6; pointer-events: none; }
    .error { background: #dc3545; color: white; padding: 15px; border-radius: 10px; margin: 20px 0; }
    .success { background: #28a745; color: white; padding: 15px; border-radius: 10px; margin: 20px 0; }
    #checkoutForm { display: none; background: white; border-radius: 20px; padding: 30px; margin-top: 20px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧥 ORIGIN-L Shop</h1>
    
    <div class="products-grid" id="productsGrid"></div>

    <div class="cart" id="cart">
      <div class="cart-header">
        <h2 class="cart-title">🛒 Warenkorb</h2>
        <div class="cart-total" id="cartTotal">0 CHF</div>
      </div>
      
      <div class="cart-items" id="cartItems">
        <div class="empty-cart">Noch nichts im Warenkorb</div>
      </div>
      
      <button class="checkout-btn" id="checkoutBtn" style="display: none;">
        Zur Kasse gehen
      </button>
    </div>

    <!-- NEU: Checkout Formular -->
    <div id="checkoutForm">
      <h3>📋 Bestelldaten</h3>
      <form id="orderForm">
        <div class="form-row">
          <div class="form-group">
            <label>Vorname *</label>
            <input type="text" id="firstName" required>
          </div>
          <div class="form-group">
            <label>Nachname *</label>
            <input type="text" id="lastName" required>
          </div>
        </div>
        
        <div class="form-group">
          <label>E-Mail *</label>
          <input type="email" id="email" required>
        </div>
        
        <div class="form-group">
          <label>Straße & Hausnummer *</label>
          <input type="text" id="street" required>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>PLZ *</label>
            <input type="text" id="zip" required pattern="[0-9]{5}">
          </div>
          <div class="form-group">
            <label>Ort *</label>
            <input type="text" id="city" required>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Land</label>
            <select id="country">
              <option value="DE">Deutschland</option>
              <option value="CH">Schweiz</option>
              <option value="AT">Österreich</option>
            </select>
          </div>
          <div class="form-group">
            <label>Versandart</label>
            <select id="shipping">
              <option value="standard">Standard (4,90 CHF)</option>
              <option value="express">Express (9,90 CHF)</option>
            </select>
          </div>
        </div>
        
        <div style="text-align: right; margin-top: 30px;">
          <button type="button" id="backToCart" class="add-to-cart" style="margin-right: 10px; background: #6c757d;">
            Zurück zum Warenkorb
          </button>
          <button type="submit" class="checkout-btn" id="submitOrder">
            Bestellung abschließen
          </button>
        </div>
      </form>
      
      <div id="orderResponse"></div>
    </div>
  </div>

  <script>
    // ECHTE BILDER aus assets/images/
    const products = [
      {
        id: "ORIGIN-L-hoodie",
        name: "ORIGIN-L Hoodie",
        price: 79,
        image: "assets/images/hoodie.jpg",  // ← ECHTE lokale Bilder
        description: "Minimalistischer Hoodie aus Bio-Baumwolle. Robust, zeitlos, nordisch."
      },
      {
        id: "ORIGIN-L-shirt",
        name: "ORIGIN-L Shirt", 
        price: 39,
        image: "assets/images/shirt.jpg",   // ← ECHTE lokale Bilder
        description: "Schlichtes T-Shirt, klare Linie, langlebige Qualität."
      }
    ];

    let cart = [];

    // [Alle renderProducts, addToCart, updateCart, removeFromCart Funktionen bleiben identisch]

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = products.map(product => `
        <div class="product-card">
          <img src="${product.image}" alt="${product.name}" class="product-image" 
               onerror="this.src='https://via.placeholder.com/400x250/1e3c72/ffffff?text=Kein+Bild'">
          <div class="product-info">
            <h3 class="product-name">${product.name}</h3>
            <p class="product-description">${product.description}</p>
            <div class="product-price">${product.price.toLocaleString('de-DE')} CHF</div>
            <button class="add-to-cart" onclick="addToCart('${product.id}', event)">
              🛒 In den Warenkorb
            </button>
          </div>
        </div>
      `).join('');
    }

    // [updateCart, removeFromCart bleiben gleich wie vorher]

    function updateCart() {
      const cartItems = document.getElementById('cartItems');
      const cartTotal = document.getElementById('cartTotal');
      const checkoutBtn = document.getElementById('checkoutBtn');

      if (cart.length === 0) {
        cartItems.innerHTML = '<div class="empty-cart">Noch nichts im Warenkorb</div>';
        checkoutBtn.style.display = 'none';
        cartTotal.textContent = '0 CHF';
        return;
      }

      cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <div class="cart-item-name">${item.name}</div>
            <div style="font-size: 0.9rem; color: #999;">
              ${item.quantity}x ${item.price.toLocaleString('de-DE')} CHF
            </div>
          </div>
          <div>
            <div class="cart-item-price">
              ${(item.price * item.quantity).toLocaleString('de-DE')} CHF
            </div>
            <button onclick="removeFromCart('${item.id}')" 
                    style="background: #dc3545; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; margin-left: 10px;">
              ❌
            </button>
          </div>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      cartTotal.textContent = `${total.toLocaleString('de-DE')} CHF`;
      checkoutBtn.style.display = 'block';
    }

    function addToCart(productId, event) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const existingItem = cart.find(item => item.id === productId);
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCart();
      
      const btn = event.target;
      const originalText = btn.innerHTML;
      btn.innerHTML = '✅ Hinzugefügt!';
      btn.style.background = '#28a745';
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.style.background = '';
      }, 1500);
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCart();
    }

    // ★★★ NEUES BACKEND ★★★
    document.getElementById('checkoutBtn').addEventListener('click', () => {
      document.getElementById('cart').style.display = 'none';
      document.getElementById('checkoutForm').style.display = 'block';
    });

    document.getElementById('backToCart').addEventListener('click', () => {
      document.getElementById('checkoutForm').style.display = 'none';
      document.getElementById('cart').style.display = 'block';
    });

    // BACKEND: Bestellung absenden
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        street: document.getElementById('street').value,
        zip: document.getElementById('zip').value,
        city: document.getElementById('city').value,
        country: document.getElementById('country').value,
        shipping: document.getElementById('shipping').value,
        cart: cart,
        total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0)
      };

      const submitBtn = document.getElementById('submitOrder');
      const responseDiv = document.getElementById('orderResponse');
      
      // Loading State
      document.body.classList.add('loading');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Wird verarbeitet...';

      try {
        // ★★★ BACKEND AUFRUF ★★★
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (response.ok) {
          responseDiv.innerHTML = `
            <div class="success">
              ✅ Bestellung erfolgreich! 
              <br><strong>Bestellnummer: ${result.orderId}</strong>
              <br>Sie erhalten in Kürze eine Bestätigungs-E-Mail.
            </div>
          `;
          cart = [];
          document.getElementById('orderForm').reset();
        } else {
          throw new Error(result.message || 'Bestellung fehlgeschlagen');
        }
      } catch (error) {
        responseDiv.innerHTML = `
          <div class="error">
            ❌ ${error.message}
            <br>Bitte versuchen Sie es erneut.
          </div>
        `;
      } finally {
        document.body.classList.remove('loading');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Bestellung abschließen';
      }
    });

    // Initialisierung
    renderProducts();
    updateCart();
  </script>
</body>
</html>
